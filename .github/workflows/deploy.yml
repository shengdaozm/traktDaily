# 部署前端页面到 GitHub Pages
# 仅当 web/ 目录有实际变更推送时才触发部署
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
  # 允许手动触发
  workflow_dispatch:

# 设置 GitHub Pages 所需的权限
permissions:
  contents: read
  pages: write
  id-token: write

# 防止多个部署任务同时运行
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # ① 检出代码
      - name: 检出仓库
        uses: actions/checkout@v4

      # ② 配置 Node.js
      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      # ③ 安装依赖并构建
      - name: 安装依赖并构建
        run: |
          npm install
          npm run build
        working-directory: web/

      # ④ 上传 Pages 产物
      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist/

      # ⑤ 部署到 GitHub Pages
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
